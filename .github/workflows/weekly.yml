name: weekly

on:
  schedule:
    - cron: "0 6 * * 1"          # Mondays 06:00 UTC (07:00/08:00 Amsterdam)
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Send the email and Teams digest even when nothing is new (for testing)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - people.yml
      - config.yml
      - overrides.yml
      - "pubpulse/**"
      - "site/**"
      - .github/workflows/weekly.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pubpulse-weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      SUBSCRIBERS_KEY: ${{ secrets.SUBSCRIBERS_KEY }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sync people and publications from OpenAlex
        # Push-triggered runs (config/code edits) do not touch the staff website; only the Monday schedule and
        # manual runs read it.
        run: python -m pubpulse sync ${{ github.event_name == 'push' && '--skip-people' || '' }}

      - name: Build site, feed and digest
        run: python -m pubpulse build

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add people.yml data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "pubpulse: weekly sync $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Read digest outputs
        id: digest
        run: |
          echo "new_count=$(cat out/new_count.txt)" >> "$GITHUB_OUTPUT"
          echo "subject=$(cat out/subject.txt)" >> "$GITHUB_OUTPUT"
          {
            echo "## pubpulse run"
            echo
            echo "New publications this run: **$(cat out/new_count.txt)**"
            echo
            echo '```'
            cat out/digest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Email digest (Gmail SMTP, one mail per subscriber)
        id: email
        if: (steps.digest.outputs.new_count != '0' || inputs.force_notify) && (env.GMAIL_USER != '' || env.SMTP_HOST != '')
        run: python -m pubpulse send-digest

      - name: Post digest to Teams
        if: "!cancelled() && (steps.digest.outputs.new_count != '0' || inputs.force_notify) && env.TEAMS_WEBHOOK_URL != ''"
        continue-on-error: true
        run: |
          curl --fail --silent --show-error -X POST -H "Content-Type: application/json" \
            --data @out/teams.json "$TEAMS_WEBHOOK_URL"

      - name: Record what has been announced
        # Runs when the email was sent or no email is configured; skipped when sending failed, so the next run
        # announces the same papers again instead of losing them.
        if: "!cancelled() && steps.email.outcome != 'failure' && steps.digest.outputs.new_count != '0'"
        run: |
          python -m pubpulse mark-notified
          git add data/pending.json
          git commit -m "pubpulse: announced through $(date -u +%Y-%m-%d)" && git push || echo "nothing to record"
