name: weekly

on:
  schedule:
    - cron: "0 6 * * 1"          # Mondays 06:00 UTC (07:00/08:00 Amsterdam): full run, digest is sent
    - cron: "0 6 * * 2-5"        # Tue-Fri: refresh papers and the digest preview only (no mail, no staff site, no SerpAPI)
  workflow_dispatch:
    inputs:
      send_now:
        description: "Send the queued digest to the list now instead of waiting for Monday"
        type: boolean
        default: false
      force_notify:
        description: "Send the email and Teams digest even when nothing is new (for testing)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - people.yml
      - overrides.yml
      - "pubpulse/**"
      - .github/workflows/weekly.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pubpulse-weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      DIGEST_TO: ${{ secrets.DIGEST_TO }}
      SUBSCRIBERS_KEY: ${{ secrets.SUBSCRIBERS_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MEMBERS_SHEET_CSV_URL: ${{ secrets.MEMBERS_SHEET_CSV_URL }}
      REVIEW_SHEET_URL: ${{ secrets.REVIEW_SHEET_URL }}
      REVIEW_SHEET_KEY: ${{ secrets.REVIEW_SHEET_KEY }}
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      # FULL = Monday schedule or a manual run: staff page, profile discovery. SEND = the digest goes to the list.
      FULL: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 1' }}
      SEND: ${{ (github.event.schedule == '0 6 * * 1' || inputs.send_now == true) && inputs.force_notify != true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache public author discovery responses
        if: env.FULL == 'true'
        uses: actions/cache@v4
        with:
          path: out/identifier-cache.json
          key: author-identifiers-${{ runner.os }}-${{ github.run_id }}
          restore-keys: author-identifiers-${{ runner.os }}-

      - name: Review the former staff collaboration roster
        if: env.FULL == 'true'
        run: python -m pubpulse review-former

      - name: Search missing profiles across all former staff
        if: env.FULL == 'true'
        run: python -m pubpulse discover-identifiers --former --max-searches 10

      - name: Discover missing author profiles using coauthors
        if: env.FULL == 'true'
        run: python -m pubpulse discover-identifiers

      - name: Sync people and publications from OpenAlex
        # Push-triggered and daily refresh runs do not touch the staff website; only the Monday schedule and
        # manual runs read it.
        run: python -m pubpulse sync ${{ env.FULL != 'true' && '--skip-people' || '' }}

      - name: LinkedIn drafts for new verified journal papers (Claude)
        if: env.ANTHROPIC_API_KEY != ''
        continue-on-error: true
        run: python -m pubpulse social-draft

      - name: Social images (card for every draft, CC-BY figure when allowed)
        continue-on-error: true
        run: python -m pubpulse social-images

      - name: Build site, feed and digest
        run: python -m pubpulse build

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add people.yml data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "pubpulse: weekly sync $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Read digest outputs
        id: digest
        run: |
          echo "new_count=$(cat out/new_count.txt)" >> "$GITHUB_OUTPUT"
          echo "pending_count=$(cat out/pending_count.txt 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
          echo "subject=$(cat out/subject.txt)" >> "$GITHUB_OUTPUT"
          {
            echo "## pubpulse run"
            echo
            echo "New publications this run: **$(cat out/new_count.txt)**"
            echo
            echo '```'
            cat out/digest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Email digest to the Brevo subscriber list (campaign)
        # Real sends go to the list only, and only on scheduled/normal runs with news; never on a forced test.
        id: email
        if: env.SEND == 'true' && steps.digest.outputs.new_count != '0' && env.BREVO_API_KEY != ''
        run: python -m pubpulse send-campaign

      - name: Test mail to DIGEST_TO (manual runs with force_notify only)
        id: email_fixed
        if: "!cancelled() && inputs.force_notify && env.DIGEST_TO != '' && (env.GMAIL_USER != '' || env.SMTP_HOST != '')"
        run: python -m pubpulse send-digest

      - name: Post digest to Teams
        if: "!cancelled() && env.SEND == 'true' && steps.digest.outputs.new_count != '0' && env.TEAMS_WEBHOOK_URL != ''"
        continue-on-error: true
        run: |
          curl --fail --silent --show-error -X POST -H "Content-Type: application/json" \
            --data @out/teams.json "$TEAMS_WEBHOOK_URL"

      - name: Record what has been announced
        # Runs when the email was sent or no email is configured; skipped when sending failed, so the next run
        # announces the same papers again instead of losing them.
        # Clears the pending list (news and archive additions) once the real send succeeded or no sender is configured.
        # Only on send runs: refresh runs keep collecting papers for the next Monday.
        if: "!cancelled() && env.SEND == 'true' && steps.email.outcome != 'failure' && steps.digest.outputs.pending_count != '0'"
        run: |
          python -m pubpulse mark-notified
          git add data/pending.json data/brevo_list.json data/digests 2>/dev/null || git add data/pending.json
          git commit -m "pubpulse: announced through $(date -u +%Y-%m-%d)" && git push || echo "nothing to record"
