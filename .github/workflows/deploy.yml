name: deploy-site

# Rebuilds the website from the committed data and deploys it. No OpenAlex sync, no staff-site access, no mail.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - data/publications.json
      - config.yml
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pubpulse-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pubpulse build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # actions/deploy-pages can miss an artifact that was uploaded a moment earlier (upstream issue
      # actions/deploy-pages#451): retry once after a pause. A re-run of the job would not help, it uploads a
      # second artifact. If the retry fails too, the job fails as before.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying the deployment
        if: steps.deploy.outcome == 'failure'
        run: sleep 20
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
