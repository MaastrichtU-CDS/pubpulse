# pubpulse configuration. Plain settings, no secrets. Secrets live in GitHub → Settings → Secrets.

group_name: Clinical Data Science (Maastro / Maastricht University)
staff_url: https://www.clinicaldatascience.nl/staff
site_url: https://maastrichtu-cds.github.io/pubpulse/
repo_url: https://github.com/MaastrichtU-CDS/pubpulse

# Membership periods (start/end date per member) come from a PRIVATE Google Sheet: shared "anyone with the link",
# the link kept in the GitHub secret MEMBERS_SHEET_CSV_URL (CSV export form:
# https://docs.google.com/spreadsheets/d/<SHEET_ID>/export?format=csv). Dates are applied in memory during a run
# and never written to the repo or the website. Locally, a gitignored members.csv works the same way.
# Start with: python -m pubpulse members-template  ->  import members-template.csv into the sheet.
members_csv: members.csv

# Website defaults (visitors can switch them in the filters).
site:
  # verified = only papers where a group author has a verified group affiliation (strictest)
  # counted  = team-window rule: a verified group affiliation, or for team members no other affiliation listed (none,
  #            or only a bare Maastricht University / MUMC+ / Radiation Oncology); papers listing another department or
  #            institution only are left out; all = everything
  # The newsletter uses the team-window rule and lists "another institution only" papers in a section of their own.
  default_view: counted
  default_include_preprints: false  # hide preprints unless switched on

# LinkedIn drafts written by Claude for verified journal papers (never preprints). Secret ANTHROPIC_API_KEY.
# Drafts are never posted automatically: they appear on the website and in the digest for a person to copy and post.
social:
  model: claude-opus-5-5

# Active sections to track. The previous-staff roster is always retained separately
# and reviewed for recent collaborations under former_staff below.
track_sections:
  - current

# Only publications from this year onwards are fetched and shown.
since_year: 2024

# OpenAlex "polite pool" contact address (faster, more reliable API access). Not used for anything else.
openalex_mailto: s.puts@maastrichtuniversity.nl

# Affiliation verification. For every publication, each group member's authorship (as recorded by OpenAlex) must
# mention one of these words (case-insensitive substring). Official strings: "Maastro, Maastricht Radiation Oncology
# Institute" and "Department of Radiation Oncology, GROW Research Institute for Oncology and Reproduction, Maastricht
# University Medical Centre+". "Maastricht University" alone is deliberately NOT enough (too wide). "Medical Data Works"
# is included because several group members are employed there. The same words decide whether a person without ORCID
# may be auto-matched in OpenAlex, and which record wins when one ORCID maps to several OpenAlex author records.
# An entry is one word (anywhere in the affiliation) or a list of words that must all occur in the SAME affiliation
# string. Radiation Oncology is not a verification word: it is also the name of many departments elsewhere, and every
# group paper that lists the Maastricht one also lists Maastro or GROW.
institution_keywords:
  - maastro
  - medical data works
  - clinical data science
  - grow

# A paper whose senior (last) author is not CDS but is listed with one of these belongs to another Maastricht group
# (e.g. Maastro physics, Radiology within GROW) and does not count, unless a CDS member is first or last author.
other_group_senior_keywords: [maastro, grow]

# Broader words used only to pick the right OpenAlex author record for a person (never to verify a paper):
# a record whose current institution matches these wins over a namesake elsewhere.
author_match_keywords: [maastricht, maastro, mumc, medical data works]
# flag    = keep all papers, show a "not verified" marker (recommended: ORCID matches with missing affiliation data stay visible)
# require = drop papers where no group member has a verified affiliation
affiliation_policy: flag

# OpenAlex work types that are never shown (supplements, errata, cover pages).
exclude_types: [supplementary-materials, erratum, paratext]

# People who disappear from the staff page keep being tracked for this many months (papers in the pipeline),
# but during that period a paper only counts when it carries a verified group affiliation for them.
departed_grace_months: 18

# Review every former staff member against current group coauthors. Recent collaborations
# renew follow-up independently of an unknown or long-past departure date.
former_staff:
  recent_collaboration_months: 24

# Be gentle with the staff website: profile pages are re-read only for new people or after this many days,
# with one request per scrape_delay_seconds. The weekly run normally makes 1-3 requests to the site.
profile_refresh_days: 30
scrape_delay_seconds: 1.0

# OpenAlex author lookups per person are cached in people.yml for this many days (saves API budget).
resolve_cache_days: 30

# Safety net: if the staff page returns fewer people than this, keep the existing list untouched.
min_people_on_staff_page: 3

digest:
  subject_prefix: "pubpulse"
  # Papers published within this many days count as news. The newsletter lists last week's papers first, then
  # earlier ones that only now reached OpenAlex. Older papers that newly appear (a person newly identified, late
  # indexing) stay on the website but are left out of the newsletter.
  recent_days: 30
  # Work types left out of the newsletter (still on the website): data deposits on Zenodo etc. are not news.
  exclude_types: [dataset]
  teams_max_items: 10
  # Subscriber list: URL of the Apps Script web app (appsscript/Code.gs) deployed under the pubpulse Gmail account.
  # The website form posts to it; the weekly job fetches the confirmed list with the SUBSCRIBERS_KEY secret and
  # sends one mail per subscriber with a personal unsubscribe link. Empty = no form, mail only to DIGEST_TO.
  subscribe_endpoint: ""
  # Brevo route (recommended): a hosted sign-up form with double opt-in, contacts in a private Brevo list, the weekly
  # digest sent as a Brevo campaign (unsubscribe link handled by Brevo). Needs secret BREVO_API_KEY.
  # subscribe_form_url = the form's "share" link from Brevo → Contacts → Forms (shown inside the website dialog).
  subscribe_form_url: "https://bf388829.sibforms.com/serve/MUIFACpHZkx1wz7dAJd7w1LIKPLAjv_A1kiQTQY2997pNnpAxxYOa0B-tgCYX3uBWA_tcFPgrxDQB-CxzMhnsIATbZ65gqCH43N3ZveJ9tW42HQi7TSskIFMPBBSjHUFUX4KQ5vfN6wygRGBT0qQrFfSJAV72KjlicSrTX1Z_1i57zcpQoCUz-bR4JjF9kpAU3PdRY17Xw7gocKZfA=="
  brevo_list_name: "pubpulse weekly"
  list_name: "the pubpulse weekly list"
  from_name: "pubpulse"
  reply_to: "s.puts@maastrichtuniversity.nl"

feed:
  max_items: 50

# Monthly Google Scholar cross-check (SerpAPI, secret SERPAPI_KEY; free plan = 250 searches/month).
# Scholar is not a data source: Scholar-only papers are listed as "possibly missing" for a human to check.
scholar:
  max_searches_per_run: 60

# Search all missing identifiers generically, using ORCID records, shared papers and Scholar coauthor links.
# ORCID public API calls are free. Scholar requests share the SerpAPI quota with the monthly cross-check.
identifier_discovery:
  max_searches_per_run: 30
  reserve_searches: 60
  refresh_days: 30
  max_network_profiles: 12
