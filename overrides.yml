# Corrections for individual papers (wrong attributions), not an approval step. Use the OpenAlex id (W…) shown
# under each paper on the website. Edit on GitHub and commit; the next run applies it.

# Papers that DO belong to the group although OpenAlex recorded no group affiliation (shown as "unverified").
confirm:
  - W7137993139  # Cecile Wolfs, 41P osimertinib + cranial RT (ESMO Open 2026): Maastro, OpenAlex lists only MUMC
  - W4409875408  # Leonard Wee, Andre Dekker, radiomics vs semantic features (medRxiv 2025): Maastro in the PDF
  - W4416157627  # Sander Puts, Dutch metaphor extraction (Suzan Verberne, Leiden): OpenAlex wrongly lists her with GROW

# Papers that do NOT belong to the group (wrong person with the same name, work from another job, …).
reject: []

# Exceptions to the team-window rule: people whose papers count only with a verified group affiliation
# (e.g. a member whose recent work is mainly affiliated elsewhere). Use the member id (slug) from people.yml.
verify_affiliation:
  - matthijs-sloep
  - ralph-brecheisen

# Senior authors who lead another group. A paper whose last author is not CDS but listed with Maastro / GROW is
# already treated as another group's (config.yml other_group_senior_keywords); names here also catch their papers
# without that affiliation. Either way a paper still counts when a CDS member is first or last author, or is listed
# under confirm. Full name as on the paper.
other_group_seniors:
  - Frank Verhaegen
  - Maria Jacobs

# CDS leads: a paper with one of them on it is a CDS paper, whoever the senior author is. Member ids from people.yml.
cds_leads:
  - andre-dekker
